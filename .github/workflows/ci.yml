name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Byte-compile
        run: python -m py_compile core/*.py server.py run.py mock_target.py tests/*.py
      - name: Unit tests
        run: |
          python tests/test_detectors.py
          python tests/test_compliance.py
          python tests/test_streaming.py
      - name: End-to-end smoke (mock target)
        run: |
          python mock_target.py &
          sleep 2
          python run.py --target config/target.example.json --phase all --history /tmp/ci_hist.jsonl
          python run.py --report --history /tmp/ci_hist.jsonl
